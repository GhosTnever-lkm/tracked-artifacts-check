name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -t .
      - name: Verify tag matches package
        run: python -c "from tracked_artifacts import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"
      - name: Build distributions and checksums
        run: |
          python -m build --outdir dist
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "tracked-artifacts-check $GITHUB_REF_NAME" --generate-notes dist/*
